name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Validate strict semantic version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a strict vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: bash scripts/build-release_test.sh

  binaries:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Smoke test Linux release binary
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          binary = f"dist/release-{tag}/uservone-mtproto-linux-amd64"
          info = json.loads(subprocess.check_output([binary, "-version-json"], text=True))
          assert info["name"] == "uservone-mtproto", info
          assert info["version"] == tag, info
          assert info["go_version"], info
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uservone-mtproto-${{ github.ref_name }}
          path: dist/release-${{ github.ref_name }}/
          if-no-files-found: error

  docker:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
          tags: |
            ghcr.io/userv-one/uservone-mtproto:${{ needs.validate.outputs.version }}
            ghcr.io/userv-one/uservone-mtproto:latest
      - name: Inspect GHCR manifest platforms
        env:
          IMAGE: ghcr.io/userv-one/uservone-mtproto:${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/ghcr-manifest.json"
          python3 - "$RUNNER_TEMP/ghcr-manifest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              manifest = json.load(file)
          platforms = {
              (entry.get("platform", {}).get("os"), entry.get("platform", {}).get("architecture"))
              for entry in manifest.get("manifests", [])
          }
          assert ("linux", "amd64") in platforms, platforms
          assert ("linux", "arm64") in platforms, platforms
          PY

  publish:
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: uservone-mtproto-${{ github.ref_name }}
          path: dist/release-${{ github.ref_name }}
      - run: gh release create "${GITHUB_REF_NAME}" dist/release-"${GITHUB_REF_NAME}"/* --title "${GITHUB_REF_NAME}" --notes "MTProto dd and fake-TLS proxy. See MIGRATION.md for platform compatibility and rollback."
