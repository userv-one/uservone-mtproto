name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - run: sha256sum -c SHA256SUMS
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: bash scripts/build-release_test.sh
      - run: go test ./core -run FuzzClientHandshakeDoesNotPanic -fuzz=FuzzClientHandshakeDoesNotPanic -fuzztime=5s
      - run: go test ./core -run FuzzFakeTLSHelloDoesNotPanic -fuzz=FuzzFakeTLSHelloDoesNotPanic -fuzztime=5s
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/uservone-mtproto ./cmd/uservone-mtproto

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uservone-mtproto:ci .
